[project]
name = "visual-search"
version = "0.1.0"
description = "Visual search engine: CLIP embeddings with brute-force, custom LSH and HNSW nearest-neighbor indexes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "tqdm>=4.66",
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "hnswlib>=0.8.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
vsearch = "visualsearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
